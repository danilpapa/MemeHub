events {
    worker_connections 1024;
}

http {
    # ── Rate Limiting ─────────────────────────────────────────────────────────
    # 10 MB shared memory zone (~160 000 unique IPs)
    # Each IP limited to 10 req/s; bursts up to 20 are served without delay
    limit_req_zone   $binary_remote_addr zone=api_zone:10m rate=10r/s;
    limit_req_status 429;

    log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent $request_time';
    access_log /var/log/nginx/access.log main;

    # ── Load Balancer ─────────────────────────────────────────────────────────
    # Round-robin upstream. To scale: docker compose up --scale gateway=N
    # and add extra `server gateway:8080;` lines here (or use DNS round-robin).
    upstream memehub_gateway {
        server gateway:8080;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Max upload size for meme images
        client_max_body_size 20m;

        location / {
            limit_req zone=api_zone burst=20 nodelay;

            proxy_pass         http://memehub_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        # nginx stub_status — consumed by nginx-prometheus-exporter
        location /nginx_status {
            stub_status;
            allow 172.0.0.0/8;
            allow 127.0.0.1;
            deny  all;
        }
    }
}
