[package]
name = "gateway"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "gzip", "brotli", "deflate"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
metrics = "0.23"
metrics-exporter-prometheus = "0.15"
http = "1"
tower-http = { version = "0.5", features = ["trace", "request-id"] }
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic", "trace"] }
tracing-opentelemetry = "0.28"
base64 = "0.22"
futures-util = "0.3"
multer = "3"
rdkafka = { version = "0.36", features = ["cmake-build"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }
aws-sdk-s3 = { version = "1", features = ["behavior-version-latest"] }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "tls-native-tls", "migrate"] }
