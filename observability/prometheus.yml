global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "gateway"
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8080"]

  - job_name: "ai_service"
    metrics_path: /metrics
    static_configs:
      - targets: ["ai_service:8000"]

  - job_name: "nginx"
    static_configs:
      - targets: ["nginx-exporter:9113"]
