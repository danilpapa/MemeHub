services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092,OUTSIDE://localhost:19092
    ports:
      - "19092:19092"
      - "9644:9644"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  redpanda-init:
    image: redpandadata/redpanda:v24.2.7
    entrypoint: ["/bin/sh", "-c"]
    command: >
      rpk topic create meme.analysis.requested meme.analysis.completed
      --brokers redpanda:9092 || true
    depends_on:
      redpanda:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=memehub
      - POSTGRES_USER=memehub
      - POSTGRES_PASSWORD=memehub
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "memehub"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/memes
      "

  clickhouse:
    image: clickhouse/clickhouse-server:24.5
    ports:
      - "8123:8123"
      - "19000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      gateway:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/nginx_status"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.1.0
    command:
      - --nginx.scrape-uri=http://nginx/nginx_status
    expose:
      - "9113"
    depends_on:
      nginx:
        condition: service_healthy

  ai_service:
    build:
      context: ./ai_service
    environment:
      - USE_LLM=0
      - PORT=8000
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:9092
      - KAFKA_ANALYSIS_REQUESTED_TOPIC=meme.analysis.requested
      - KAFKA_ANALYSIS_COMPLETED_TOPIC=meme.analysis.completed
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
    ports:
      - "8000:8000"
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy

  gateway:
    build:
      context: ./gateway
    environment:
      - AI_SERVICE_URL=http://ai_service:8000
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_SERVICE_NAME=gateway
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:9092
      - KAFKA_ANALYSIS_REQUESTED_TOPIC=meme.analysis.requested
      - KAFKA_ANALYSIS_COMPLETED_TOPIC=meme.analysis.completed
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgres://memehub:memehub@postgres:5432/memehub?sslmode=disable
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=memes
    ports:
      - "8080:8080"
    volumes:
      - ./gateway/logs:/app/logs
    depends_on:
      ai_service:
        condition: service_started
      jaeger:
        condition: service_started
      redpanda-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  jaeger:
    image: jaegertracing/all-in-one:1.59
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"
      - "4317:4317"

volumes:
  redis_data:
  pg_data:
  minio_data:
  clickhouse_data:
