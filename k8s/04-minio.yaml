apiVersion: v1
kind: Secret
metadata:
  name: minio-secret
  namespace: memehub
type: Opaque
stringData:
  root-user: minioadmin
  root-password: minioadmin

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: memehub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
      - name: minio
        image: minio/minio:latest
        command:
          - sh
          - -c
          - minio server /data --console-address :9001
        env:
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: minio-secret
              key: root-user
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: minio-secret
              key: root-password
        ports:
        - containerPort: 9000
          name: api
        - containerPort: 9001
          name: console
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: minio-data
          mountPath: /data
      volumes:
      - name: minio-data
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: memehub
spec:
  selector:
    app: minio
  ports:
  - name: api
    port: 9000
    targetPort: 9000
  - name: console
    port: 9001
    targetPort: 9001
  type: NodePort

---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  namespace: memehub
spec:
  template:
    spec:
      containers:
      - name: init
        image: minio/mc:latest
        command:
          - /bin/sh
          - -c
          - |
            mc alias set local http://minio:9000 minioadmin minioadmin
            mc mb --ignore-existing local/memes
      restartPolicy: Never
  backoffLimit: 3
