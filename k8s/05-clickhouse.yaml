apiVersion: apps/v1
kind: Deployment
metadata:
  name: clickhouse
  namespace: memehub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clickhouse
  template:
    metadata:
      labels:
        app: clickhouse
    spec:
      containers:
      - name: clickhouse
        image: clickhouse/clickhouse-server:24.5
        ports:
        - containerPort: 8123
          name: http
        - containerPort: 9000
          name: native
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        volumeMounts:
        - name: clickhouse-data
          mountPath: /var/lib/clickhouse
      volumes:
      - name: clickhouse-data
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: memehub
spec:
  selector:
    app: clickhouse
  ports:
  - name: http
    port: 8123
    targetPort: 8123
  - name: native
    port: 19000
    targetPort: 9000
  type: ClusterIP
