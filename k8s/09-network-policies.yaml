# Simplified Cilium Network Policies for MemeHub
# Compatible with Cilium 1.15+

---
# Allow external traffic to gateway
apiVersion: cilium.io/v2alpha1
kind: CiliumNetworkPolicy
metadata:
  name: allow-gateway-external
  namespace: memehub
spec:
  description: "Allow external traffic to gateway"
  endpointSelector:
    matchLabels:
      app: gateway
  ingress:
  - fromEndpoints:
    - {}
    toPorts:
    - ports:
      - port: "8080"
        protocol: TCP

---
# Allow gateway to reach ai-service
apiVersion: cilium.io/v2alpha1
kind: CiliumNetworkPolicy
metadata:
  name: allow-gateway-to-ai
  namespace: memehub
spec:
  description: "Allow gateway to reach ai-service"
  endpointSelector:
    matchLabels:
      app: ai-service
  ingress:
  - fromEndpoints:
    - matchLabels:
        app: gateway
    toPorts:
    - ports:
      - port: "8000"
        protocol: TCP

---
# Allow gateway to reach redis
apiVersion: cilium.io/v2alpha1
kind: CiliumNetworkPolicy
metadata:
  name: allow-gateway-to-redis
  namespace: memehub
spec:
  description: "Allow gateway to reach redis"
  endpointSelector:
    matchLabels:
      app: redis
  ingress:
  - fromEndpoints:
    - matchLabels:
        app: gateway
    toPorts:
    - ports:
      - port: "6379"
        protocol: TCP

---
# Allow gateway and ai-service to reach kafka
apiVersion: cilium.io/v2alpha1
kind: CiliumNetworkPolicy
metadata:
  name: allow-to-kafka
  namespace: memehub
spec:
  description: "Allow gateway and ai-service to reach kafka"
  endpointSelector:
    matchLabels:
      app: redpanda
  ingress:
  - fromEndpoints:
    - matchLabels:
        app: gateway
    - matchLabels:
        app: ai-service
    toPorts:
    - ports:
      - port: "9092"
        protocol: TCP

