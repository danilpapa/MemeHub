apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: memehub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway
        image: memehub-gateway:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: AI_SERVICE_URL
          value: "http://ai-service:8000"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://jaeger:4317"
        - name: OTEL_SERVICE_NAME
          value: "gateway"
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "redpanda:9092"
        - name: KAFKA_ANALYSIS_REQUESTED_TOPIC
          value: "meme.analysis.requested"
        - name: KAFKA_ANALYSIS_COMPLETED_TOPIC
          value: "meme.analysis.completed"
        - name: REDIS_URL
          value: "redis://redis:6379"
        - name: DATABASE_URL
          value: "postgres://memehub:memehub@postgres:5432/memehub?sslmode=disable"
        - name: MINIO_ENDPOINT
          value: "http://minio:9000"
        - name: MINIO_ACCESS_KEY
          value: "minioadmin"
        - name: MINIO_SECRET_KEY
          value: "minioadmin"
        - name: MINIO_BUCKET
          value: "memes"
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: memehub
spec:
  selector:
    app: gateway
  ports:
  - port: 8080
    targetPort: 8080
  type: NodePort
