apiVersion: v1
kind: ConfigMap
metadata:
  name: redpanda-config
  namespace: memehub
data:
  redpanda.yaml: |
    redpanda:
      data_directory: /var/lib/redpanda/data
      node_id: 0
      rpc_server:
        address: "0.0.0.0"
        port: 33145
      kafka_api:
        - address: "0.0.0.0"
          port: 9092
      admin:
        - address: "0.0.0.0"
          port: 9644
      advertised_kafka_api:
        - address: "redpanda"
          port: 9092

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda
  namespace: memehub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redpanda
  template:
    metadata:
      labels:
        app: redpanda
    spec:
      containers:
      - name: redpanda
        image: redpandadata/redpanda:v24.2.7
        command:
          - redpanda
          - start
          - --config-file=/etc/redpanda/redpanda.yaml
        ports:
        - containerPort: 9092
          name: kafka
        - containerPort: 9644
          name: admin
        - containerPort: 33145
          name: rpc
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        volumeMounts:
        - name: redpanda-data
          mountPath: /var/lib/redpanda/data
        - name: redpanda-config
          mountPath: /etc/redpanda
      volumes:
      - name: redpanda-data
        emptyDir: {}
      - name: redpanda-config
        configMap:
          name: redpanda-config

---
apiVersion: v1
kind: Service
metadata:
  name: redpanda
  namespace: memehub
spec:
  selector:
    app: redpanda
  ports:
  - name: kafka
    port: 9092
    targetPort: 9092
  - name: admin
    port: 9644
    targetPort: 9644
  type: ClusterIP

---
apiVersion: batch/v1
kind: Job
metadata:
  name: redpanda-init
  namespace: memehub
spec:
  template:
    spec:
      containers:
      - name: init
        image: redpandadata/redpanda:v24.2.7
        command:
          - /bin/sh
          - -c
          - |
            /opt/redpanda/bin/rpk topic create meme.analysis.requested meme.analysis.completed --brokers redpanda:9092 || true
      restartPolicy: Never
  backoffLimit: 3
